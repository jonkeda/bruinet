name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # A pull request that takes tests away (deleted, fewer, skipped, fewer assertions) fails unless
  # its description says why; the script's -Reason is that why (AD-033).
  test-guard:
    name: Test guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No tests taken away
        shell: pwsh
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          $reason = if ($env:BODY -match 'Tests removed because:\s*(.+)') { $Matches[1] } else { '' }
          ./tools/Scripts/check-test-guard.ps1 -Base origin/${{ github.base_ref }} -Head HEAD -Reason $reason

  build-and-test:
    name: Build and unit test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java (Android build)
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Restore workloads
        run: dotnet workload restore Bruinet.sln

      # Debug on purpose: the UI Automation bridge only compiles in Debug
      # (src/Bruinet.Uia.Contracts/Bruinet.Uia.Bridge.props), and Debug is what the
      # test suites are written against.
      # Every project in the repository but the two VSIX projects (see ide-extensions).
      - name: Build
        run: dotnet build Bruinet.sln -v:minimal /nr:false

      # Whitespace as .editorconfig says (AD-033); the analyzers and code style ran in the build.
      - name: Format
        run: dotnet format whitespace Bruinet.sln --verify-no-changes --no-restore -v:minimal

      # Unit tests only. The *.UITests projects (UI tests and UAT suites) launch real apps and
      # stay local; see AGENTS.md "Match the test scope to the change". The MAUI ones also run in
      # memory, below. The project list is the script's; it also measures coverage, a report in the
      # run's summary and the coverage-report artifact, never a gate (AD-033).
      - name: Unit tests
        shell: pwsh
        run: ./tools/Scripts/coverage.ps1 -NoBuild -Results TestResults/ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/ci/report
          if-no-files-found: warn

      # The MAUI UI and UAT suites on the MauiHeadless head (AD-032): the apps rendered in the test
      # process, no app launched, no window. The device tests skip with their reason.
      - name: MAUI suites on MauiHeadless
        if: always()
        shell: pwsh
        env:
          BRUINET_HEAD: headless
        run: ./tools/Scripts/test-maui-headless.ps1 -NoBuild -Results TestResults/ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/ci/*.trx
          if-no-files-found: warn

  # The same MAUI suites on MauiHeadless on a Mac: off Windows they build for plain net10.0 with the
  # MauiHeadless and Appium heads only (BruinetWindowsHead, Directory.Build.props).
  maui-headless-macos:
    name: MAUI suites on MauiHeadless (macOS)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The apps' MauiHeadless builds compile MAUI XAML; their AppSupport also targets Android and iOS, which
      # a restore resolves without building.
      - name: Install the MAUI workload
        run: dotnet workload install maui

      - name: MAUI suites on MauiHeadless
        shell: pwsh
        env:
          BRUINET_HEAD: headless
        run: ./tools/Scripts/test-maui-headless.ps1 -Results TestResults/ci-macos

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: TestResults/ci-macos/*.trx
          if-no-files-found: warn

  pack:
    name: Pack
    runs-on: windows-latest
    needs: build-and-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore src/Bruinet.Maui.CommunityToolkit/Bruinet.Maui.CommunityToolkit.csproj

      - name: Pack libraries
        shell: pwsh
        run: ./tools/Scripts/pack.ps1 -Version "0.1.0-ci.${{ github.run_number }}" -Output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # The IDE extensions build: the VSIX needs Visual Studio's MSBuild, so Bruinet.sln holds its two
  # projects with Build unticked, and they are built here from their own .slnx.
  # Their tests (Bruinet.Bdd.*.Tests) need the Todo sample built and stay local, like the UI tests.
  ide-extensions:
    name: IDE extensions
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Visual Studio extension
        run: msbuild tools/Bruinet.Bdd.VisualStudio/Bruinet.Bdd.VisualStudio.slnx -restore -p:DeployExtension=false -v:minimal

      - name: VS Code extension
        shell: pwsh
        working-directory: tools/Bruinet.Bdd.VsCode
        run: |
          npm ci
          npm run compile

      - name: Upload the VSIX
        uses: actions/upload-artifact@v4
        with:
          name: visual-studio-extension
          path: tools/Bruinet.Bdd.VisualStudio/bin/Debug/net48/Bruinet.Bdd.VisualStudio.vsix
