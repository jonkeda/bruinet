<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two buttons of one name</title>
  <link rel="stylesheet" href="../../assets/site.css">
</head>
<body>
  <!-- A planted fault for the factory: two buttons that say the same. A class cannot have two members of one name,
       and a locator by the text finds both. -->
  <main>
    <h1>Orders</h1>
    <section><h2>Open</h2><button type="button">Details</button></section>
    <section><h2>Closed</h2><button type="button">Details</button></section>
    <button type="button">Refresh</button>
  </main>
</body>
</html>
