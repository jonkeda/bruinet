    </g></g><g role="group" aria-label="Create department"><text x="124" y="40" class="wire-text wire-text-bold" style="font-size: 24px">Create department</text></g><g role="textbox" aria-label="Name" aria-required="true"><g><text x="16" y="74" class="wire-text wire-text-small">Name</text>
